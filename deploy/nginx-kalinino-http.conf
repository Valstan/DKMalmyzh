# Бутстрап для сдк-калинино.вмалмыже.рф на время выпуска сертификата (D-074):
# только :80 с ACME-локацией. Ставится switch-kalinino-domain.yml на минуту —
# между отключением vhost Калинино и расширением сертификата портала третьим
# именем; затем заменяется на nginx-kalinino-redirect.conf.
#
# Редиректа на https здесь нет намеренно: сертификата на это имя ещё нет, и
# редирект увёл бы посетителя на 443 default_server соседа.

server {
    listen 80;
    listen [::]:80;
    server_name xn----8sbksaibjtblz.xn--80adkdyec4j.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dkmalmyzh-acme;
        try_files $uri =404;
    }

    location / {
        return 301 http://xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/dk/kalinino;
    }
}
