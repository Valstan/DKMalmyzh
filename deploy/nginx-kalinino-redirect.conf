# Прежний домен Калининской ЦКС — сдк-калинино.вмалмыже.рф → раздел портала.
# Ставится ТОЛЬКО воркфлоу switch-kalinino-domain.yml, а не деплоем (D-074):
# пока это имя держит vhost самого Калинино, второй блок с тем же server_name
# перехватил бы домен раньше времени (первый файл по алфавиту выигрывает), а
# сертификат портала это имя ещё не покрывает — посетитель получил бы ошибку TLS.
#
# Сертификат — та же линия, что у портала (--cert-name по основному домену,
# расширенная третьим именем). Порядок: этот файл ставится ПОСЛЕ выпуска.
#
# Правила переноса путей:
#   /                       → /dk/kalinino  (сайт одного учреждения → его раздел)
#   /news/category/<slug>   → /dk/kalinino  (страниц рубрик у портала нет)
#   /news/<slug>            → /news/<slug>  путь-в-путь: slug записей сохранён из
#                             выгрузки, поэтому старые ссылки остаются рабочими
#   /news                   → /dk/kalinino  (их общая лента = наш раздел)
#   прочее                  → /dk/kalinino
# $request_uri уже percent-encoded, nginx его не декодирует (G300).

server {
    listen 80;
    listen [::]:80;
    server_name xn----8sbksaibjtblz.xn--80adkdyec4j.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dkmalmyzh-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn----8sbksaibjtblz.xn--80adkdyec4j.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        return 301 https://xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/dk/kalinino;
    }

    location = /news {
        return 301 https://xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/dk/kalinino;
    }

    location ^~ /news/category/ {
        return 301 https://xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/dk/kalinino;
    }

    location ^~ /news/ {
        return 301 https://xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai$request_uri;
    }

    location / {
        return 301 https://xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/dk/kalinino;
    }
}
