# nginx-vhost портала «Культура Малмыжского района» — рабочая версия с TLS.
#
# Имён два, и роли у них разные:
#   • культура.вмалмыже.рф   — ОСНОВНОЙ домен портала, отдаёт сайт;
#   • домкультуры.вмалмыже.рф — прежний, отдаёт 301 (см. второй 443-блок ниже).
#
# Ставится deploy-prod.yml, когда на боксе есть LE-сертификат
# (/etc/letsencrypt/live/xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/ — одна линия
# на оба имени). Выпуск — `.github/workflows/setup-tls.yml`; продление —
# системный таймер certbot.
#
# ⚠️ Порядок необратим по последствиям: сертификат выпускается ПЕРВЫМ, конфиг
# едет вторым. Если выкатить этот файл раньше выпуска, deploy не найдёт
# live/<новый>/fullchain.pem, откатится на бутстрап-vhost — и сайт останется без
# HTTPS вовсе.
#
# ⚠️ TLS терминирует сам nginx, как и у остальных сайтов на этом боксе. Редирект
# http→https — по $scheme; X-Forwarded-Proto здесь не при чём: это схема другого
# бокса портфеля, где фронтом стоит прокси хостера.
#
# ⚠️ `listen 443 ssl default_server` держит НЕ наш vhost — https без совпадения по
# server_name уходит соседу. Отсюда требование: имя в server_name ниже обязано
# совпадать с боевым Host в punycode буква-в-букву.

server {
    listen 80;
    listen [::]:80;
    # Имён здесь ДВА, а в 443-блоке ниже пока одно. Это не рассинхрон, а условие
    # выпуска сертификата: certbot валидирует новое имя по HTTP на :80, и пока
    # оно тут не перечислено, челлендж уходит на default_server соседа и отдаёт
    # 404. TLS для нового имени включается отдельным шагом — после выпуска.
    server_name xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai;

    # ACME-челлендж — до редиректа, иначе продление сертификата не пройдёт.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dkmalmyzh-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 на боксе: http2 — параметр listen (директива http2 появилась в 1.25).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai;

    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    # Иммутабельные ассеты Next — длинный кэш снимает нагрузку с единственного vCPU.
    # Запускатор импорта из ВК. Дёргает его таймер systemd прямо на 127.0.0.1:3005,
    # мимо nginx, — снаружи маршрут не нужен вовсе. Секрет в заголовке у него свой,
    # но публично доступный запускатор долгой задачи это ещё и способ занять
    # единственный vCPU, поэтому закрываем и на фронте.
    location /internal/ {
        deny all;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Медиа из админки (public/media → shared/media).
    location /media/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        expires 30d;
    }

    # ⚠️ Пула keep-alive к приложению здесь НЕТ: нет блока `upstream` с
    # `keepalive N`, соединение к :3005 открывается на запрос. Поэтому гонка
    # G234 (nginx шлёт запрос в сокет, который Node только что закрыл по своему
    # keepAliveTimeout=5s → случайные 502 на сериях POST) нам не грозит.
    # Добавляешь `upstream` с `keepalive` — обязан в ТОТ ЖЕ заход поднять
    # таймауты Node. Через переменную KEEP_ALIVE_TIMEOUT одну её не поднять:
    # Next standalone прокидывает только keepAliveTimeout, а Node требует
    # headersTimeout (дефолт 60000) СТРОГО больше — нужен свой server-обёртка,
    # где выставлены оба (напр. 65000 / 66000 при keepalive 60s у nginx).
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m; # загрузки в админку (Media)
    }
}

# Прежний домен: 301 на портал. Тем же сертификатом — он выписан на оба имени.
#
# Корень уводим в раздел РЦКД: домкультуры.вмалмыже.рф был сайтом одного
# учреждения, и человек, набравший его руками, ищет именно это учреждение, а не
# районную ленту.
#
# Всё остальное переносим путь-в-путь. Контент общий: новость РЦКД лежит по тому
# же /news/<slug> и на новом домене, поэтому старые ссылки из поиска и из
# сообщений остаются рабочими, а не схлопываются на главную (что поисковики
# засчитывают как soft-404).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        return 301 https://xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/dk/rckd;
    }

    location / {
        return 301 https://xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai$request_uri;
    }
}
