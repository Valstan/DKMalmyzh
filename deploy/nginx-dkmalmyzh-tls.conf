# nginx-vhost портала «Культура Малмыжского района» — рабочая версия с TLS.
#
# Имён два, и роли у них разные:
#   • культура.вмалмыже.рф     — ОСНОВНОЙ домен портала;
#   • домкультуры.вмалмыже.рф   — адрес раздела головного учреждения (ДК Малмыж,
#     РЦКД). Корень второго имени — это вход в раздел: 301 на /dk/rckd основного
#     домена (заказ владельца 30.09). Остальные пути второго имени — алиас:
#     отдают ТОТ ЖЕ сайт, поэтому в браузере имя сохраняется на всех страницах
#     раздела. Каноникал при этом смотрит на основной домен (canonicalOf в коде),
#     так что дубля в индексе нет.
#
# Ставится deploy-prod.yml, когда на боксе есть LE-сертификат
# (/etc/letsencrypt/live/xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/ — одна линия
# на оба имени). Выпуск — `.github/workflows/setup-tls.yml`; продление —
# системный таймер certbot.
#
# ⚠️ Порядок необратим по последствиям: сертификат выпускается ПЕРВЫМ, конфиг
# едет вторым. Если выкатить этот файл раньше выпуска, deploy не найдёт
# live/<новый>/fullchain.pem, откатится на бутстрап-vhost — и сайт останется без
# HTTPS вовсе.
#
# ⚠️ TLS терминирует сам nginx, как и у остальных сайтов на этом боксе. Редирект
# http→https — по $scheme; X-Forwarded-Proto здесь не при чём: это схема другого
# бокса портфеля, где фронтом стоит прокси хостера.
#
# ⚠️ `listen 443 ssl default_server` держит НЕ наш vhost — https без совпадения по
# server_name уходит соседу. Отсюда требование: имя в server_name ниже обязано
# совпадать с боевым Host в punycode буква-в-букву.

server {
    listen 80;
    listen [::]:80;
    # Имён здесь ДВА, как и в 443-блоке ниже: второе имя — алиас раздела ДК.
    # Замечание про выпуск: certbot валидирует новое имя по HTTP на :80, и пока
    # оно тут не перечислено, челлендж уходит на default_server соседа и отдаёт
    # 404. TLS для нового имени включается отдельным шагом — после выпуска.
    server_name xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai;

    # ACME-челлендж — до редиректа, иначе продление сертификата не пройдёт.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dkmalmyzh-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 на боксе: http2 — параметр listen (директива http2 появилась в 1.25).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai;

    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Минимальная CSP (письмо Мозга 14.09, опыт портала): три директивы, которые
    # ничего не ломают в рендере — не трогают script/img/frame-src, поэтому
    # Метрика, внешние обложки и встроенные плееры ВК живут как жили.
    #   frame-ancestors — дубль X-Frame-Options для браузеров, которые его игнорируют;
    #   form-action     — куда можно отправлять формы (у нас только свой origin);
    #   base-uri        — запрет подмены <base>.
    add_header Content-Security-Policy "frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;
    # X-Powered-By снимает и Next (poweredByHeader: false), и nginx — на случай
    # старого релиза за прокси.
    proxy_hide_header X-Powered-By;
    # Версия nginx в заголовке Server и в подвале страниц ошибок. На общей
    # машине, где состав соседей сам по себе чувствителен, бесплатная разведка
    # версии не нужна. Директива действует в контексте server и перекрывает
    # http{}, поэтому править чужую глобальную настройку не требуется.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    # Иммутабельные ассеты Next — длинный кэш снимает нагрузку с единственного vCPU.
    # Запускатор импорта из ВК. Дёргает его таймер systemd прямо на 127.0.0.1:3005,
    # мимо nginx, — снаружи маршрут не нужен вовсе. Секрет в заголовке у него свой,
    # но публично доступный запускатор долгой задачи это ещё и способ занять
    # единственный vCPU, поэтому закрываем и на фронте.
    location /internal/ {
        deny all;
    }

    # Корень второго имени — вход в раздел головного учреждения (заказ владельца
    # 30.09): 301 на /dk/rckd основного домена. Только точное совпадение `/` —
    # остальные пути второго имени отдаёт location / ниже как алиас.
    location = / {
        if ($host = xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai) {
            return 301 https://xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/dk/rckd;
        }
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        # Заголовки безопасности объявлены здесь намеренно. Правило nginx: add_header
        # наследуется с внешнего уровня, только если на текущем НИ ОДНОГО нет —
        # а раньше здесь стоял свой Cache-Control, и все пять верхних заголовков
        # молча пропадали на всём префиксе статики (аудит #057).
        #
        # Свой Cache-Control для этих файлов НЕ ставим: Next уже присылает
        # `public, max-age=31536000, immutable` для /_next/static, и вместе с нашим
        # в ответе оказывалось два заголовка. Пока в этом блоке есть хоть один
        # add_header — эти пять надо обновлять вместе с ним.
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;
    }

    # Медиа из админки (public/media → shared/media).
    location /media/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        expires 30d;
    }

    # ⚠️ Пула keep-alive к приложению здесь НЕТ: нет блока `upstream` с
    # `keepalive N`, соединение к :3005 открывается на запрос. Поэтому гонка
    # G234 (nginx шлёт запрос в сокет, который Node только что закрыл по своему
    # keepAliveTimeout=5s → случайные 502 на сериях POST) нам не грозит.
    # Добавляешь `upstream` с `keepalive` — обязан в ТОТ ЖЕ заход поднять
    # таймауты Node. Через переменную KEEP_ALIVE_TIMEOUT одну её не поднять:
    # Next standalone прокидывает только keepAliveTimeout, а Node требует
    # headersTimeout (дефолт 60000) СТРОГО больше — нужен свой server-обёртка,
    # где выставлены оба (напр. 65000 / 66000 при keepalive 60s у nginx).
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m; # загрузки в админку (Media)
    }
}
