# nginx-vhost для домкультуры.вмалмыже.рф (Бокс 1) — рабочая версия с TLS.
# Ставится deploy-prod.yml, когда на боксе есть LE-сертификат домена
# (/etc/letsencrypt/live/xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai/). Выпуск —
# `.github/workflows/setup-tls.yml`; продление — системный таймер certbot.
#
# ⚠️ TLS терминирует сам nginx (как у соседей по боксу: гоньба.рф, вмалмыже.рф,
# калинино, тренер). Редирект http→https — по $scheme; X-Forwarded-Proto здесь
# не при чём (это была бы схема бокса Сабантуя, где фронтом стоит прокси Джино).
#
# ⚠️ Соседний vhost гоньба.рф объявлен `listen 443 ssl default_server` — https
# без совпадения по server_name уходит к нему. Отсюда требование: имя в
# server_name ниже обязано совпадать с боевым Host в punycode буква-в-букву.

server {
    listen 80;
    listen [::]:80;
    server_name xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai;

    # ACME-челлендж — до редиректа, иначе продление сертификата не пройдёт.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dkmalmyzh-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 на боксе: http2 — параметр listen (директива http2 появилась в 1.25).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai;

    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    # Иммутабельные ассеты Next — длинный кэш снимает нагрузку с единственного vCPU.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Медиа из админки (public/media → shared/media).
    location /media/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        expires 30d;
    }

    # ⚠️ Пула keep-alive к приложению здесь НЕТ: нет блока `upstream` с
    # `keepalive N`, соединение к :3005 открывается на запрос. Поэтому гонка
    # G234 (nginx шлёт запрос в сокет, который Node только что закрыл по своему
    # keepAliveTimeout=5s → случайные 502 на сериях POST) нам не грозит.
    # Добавляешь `upstream` с `keepalive` — обязан в ТОТ ЖЕ заход поднять
    # таймауты Node. Через переменную KEEP_ALIVE_TIMEOUT одну её не поднять:
    # Next standalone прокидывает только keepAliveTimeout, а Node требует
    # headersTimeout (дефолт 60000) СТРОГО больше — нужен свой server-обёртка,
    # где выставлены оба (напр. 65000 / 66000 при keepalive 60s у nginx).
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m; # загрузки в админку (Media)
    }
}
