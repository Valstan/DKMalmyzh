# nginx-vhost портала «Культура Малмыжского района» — БУТСТРАП-версия
# (только :80, без TLS). Ставится деплой-воркфлоу, пока на боксе ещё нет
# LE-сертификата для домена; как только он появится, deploy-prod.yml сам
# переключается на `nginx-dkmalmyzh-tls.conf`. Сертификат выпускает
# `.github/workflows/setup-tls.yml` (certbot --webroot через ACME-локацию ниже).
#
# ⚠️ На этом боксе TLS терминирует САМ nginx (`443 ssl managed by Certbot`),
# а не внешний прокси хостера. Поэтому редиректа на https здесь нет: пока
# сертификата нет, редирект увёл бы посетителей на 443 default_server
# соседнего сайта.
#
# Прежний домен дкмалмыж.рф выведен из обращения (регистрация истекла) —
# в server_name его нет намеренно.
#
# Имён здесь ДВА: культура.вмалмыже.рф (основной домен портала) и
# домкультуры.вмалмыже.рф (прежний, уходит в 301 на раздел РЦКД). Оба обязаны
# отвечать по :80 ещё до выпуска сертификата — certbot валидирует каждое имя
# отдельно, и по не отвечающему получим fail валидации и удар по rate-limit.

server {
    listen 80;
    listen [::]:80;
    server_name xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai;

    charset utf-8;

    # ACME-челлендж для выпуска/продления LE — без редиректа и без прокси.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dkmalmyzh-acme;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    # Запускатор импорта из ВК. Дёргает его таймер systemd прямо на 127.0.0.1:3005,
    # мимо nginx, — снаружи маршрут не нужен вовсе. Секрет в заголовке у него свой,
    # но публично доступный запускатор долгой задачи это ещё и способ занять
    # единственный vCPU, поэтому закрываем и на фронте.
    location /internal/ {
        deny all;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m; # загрузки в админку (Media)
    }
}
