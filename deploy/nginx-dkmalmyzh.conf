# nginx-vhost для домкультуры.вмалмыже.рф (Бокс 1, 92.51.22.114) — БУТСТРАП-версия
# (только :80, без TLS). Ставится деплой-воркфлоу, пока на боксе ещё нет
# LE-сертификата для домена; как только он появится, deploy-prod.yml сам
# переключается на `nginx-dkmalmyzh-tls.conf`. Сертификат выпускает
# `.github/workflows/setup-tls.yml` (certbot --webroot через ACME-локацию ниже).
#
# ⚠️ На этом боксе TLS терминирует САМ nginx (у соседей — `443 ssl managed by
# Certbot`), а не внешний прокси Джино. Поэтому редиректа на https здесь нет:
# пока сертификата нет, редирект увёл бы посетителей на 443 default_server
# соседнего сайта (гоньба.рф).
#
# Прежний домен дкмалмыж.рф выведен из обращения (регистрация истекла) —
# в server_name его нет намеренно.

server {
    listen 80;
    listen [::]:80;
    server_name xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai;

    charset utf-8;

    # ACME-челлендж для выпуска/продления LE — без редиректа и без прокси.
    location ^~ /.well-known/acme-challenge/ {
        root /home/valstan/dkmalmyzh/acme;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m; # загрузки в админку (Media)
    }
}
