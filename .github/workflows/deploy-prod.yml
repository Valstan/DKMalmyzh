name: Deploy to production

# Сборка едет в CI (ubuntu), т.к. прод-VPS (мало RAM) не тянет next build.
# На сервер по SSH кладём готовый standalone-артефакт и рестартим systemd-сервис.
#
# Требуется:
#   secrets.SSH_PRIVATE_KEY        — приватная часть деплой-ключа
#   secrets.DATABASE_URI           — строка подключения к прод-БД (для CI-сборки НЕ нужна — там эфемерная; здесь не используется на сборке, но имя зарезервировано для будущих шагов)
#   secrets.PAYLOAD_SECRET         — секрет Payload (на рантайме читается из /etc/dkmalmyzh/dkmalmyzh.env)
#   secrets.DEPLOY_SSH_HOST        — хост прод-сервера. Именно secret, а не var (D-038):
#                                    значения vars раскрываются в публичном логе прогона,
#                                    маскируются только secrets.
#   vars.DEPLOY_SSH_PORT           — внешний SSH-порт. Осознанно оставлен в vars: значение
#                                    стандартное и сверхкороткое, а маскируется КАЖДОЕ его
#                                    вхождение — в secrets оно замазало бы пол-лога.
#   vars.NEXT_PUBLIC_SERVER_URL    — боевой домен (punycode домкультуры.вмалмыже.рф; бейкается в бандл при сборке)
#   vars.NEXT_PUBLIC_YANDEX_METRICA_ID — номер счётчика Метрики (D-017); пусто → тег не рендерится
#   vars.NEXT_PUBLIC_METRIKA_INFORMER  — '1' → видимый информер в подвале (только после включения настройки в кабинете)

on:
  push:
    branches: [main]
    # docs/почта/markdown/инфра не трогают прод-артефакт — не гоняем пересборку+рестарт зря.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dkmalmyzh_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Предохранитель миграций. Стандартный standalone-бандл не несёт payload CLI,
      # поэтому миграции применяются на проде ВРУЧНУЮ (apply-migration.yml: psql -f
      # .sql + запись в payload_migrations) ДО деплоя кода. Ручной workflow_dispatch
      # означает «уже применил» — там guard пропускается.
      #
      # Гейт сверяет миграции репозитория с РЕЕСТРОМ НА ПРОДЕ, а не с прошлым
      # коммитом.
      #
      # Прежняя версия смотрела только `HEAD~1..HEAD` и потому останавливала ровно
      # тот коммит, который миграцию вносит. Следующий коммит нёс тот же
      # неприменённый код дальше — и деплоился спокойно. Поймано 31.08 на живом
      # проде: миграция institutions осталась неприменённой, код, который её
      # требует, уехал следующим же PR, `/api/posts` и `/api/institutions` начали
      # отдавать 500, а публичные страницы держались только на мягкой деградации —
      # то есть снаружи поломка была почти не видна.
      #
      # Источник правды о применённом — таблица payload_migrations на проде.
      # Нечитаемый реестр останавливает деплой: «не смогли проверить» здесь не
      # то же самое, что «всё в порядке».
      - name: Migration guard
        if: github.event_name != 'workflow_dispatch'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_guard
          chmod 600 ~/.ssh/id_ed25519_guard
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          set +e
          APPLIED=$(ssh -i ~/.ssh/id_ed25519_guard -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "$DEPLOY_SSH_PORT" "valstan@$DEPLOY_SSH_HOST" 'bash -s' <<'REMOTE'
          set -e
          DB=$(sudo grep '^DATABASE_URI=' /etc/dkmalmyzh/dkmalmyzh.env | head -1 | sed 's/^DATABASE_URI=//;s/^"//;s/"$//')
          [ -n "$DB" ] || exit 3
          psql "$DB" -tAc "SELECT name FROM payload_migrations ORDER BY name;"
          REMOTE
          )
          RC=$?
          set -e
          rm -f ~/.ssh/id_ed25519_guard

          if [ "$RC" -ne 0 ]; then
            echo "::error::реестр миграций на проде не прочитан (код $RC) — деплой остановлен"
            exit 1
          fi

          MISSING=""
          for f in web/src/migrations/*.sql; do
            NAME=$(basename "$f" .sql)
            printf '%s\n' "$APPLIED" | grep -qxF "$NAME" || MISSING="$MISSING $NAME"
          done

          if [ -n "$MISSING" ]; then
            echo "::error::на проде не применены миграции:$MISSING"
            echo "Накати их через apply-migration.yml (по одной), затем запусти деплой через workflow_dispatch."
            exit 1
          fi
          echo "все миграции репозитория есть в реестре прода — деплой продолжается"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Generate importmap + types
        working-directory: web
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/dkmalmyzh_build
        run: |
          pnpm generate:importmap
          pnpm generate:types

      - name: Build (standalone)
        working-directory: web
        env:
          # Эфемерная БД CI: push:true создаёт схему здесь, prerender отдаёт пустые
          # страницы (контента в CI нет) — рантайм наполнит через ISR/ревалидацию.
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/dkmalmyzh_build
          PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL || 'http://127.0.0.1:3005' }}
          # Аналитика (D-017). Пусто → тег Метрики и информер не рендерятся;
          # NEXT_PUBLIC_* бейкаются здесь, в бандл, а не читаются в рантайме.
          NEXT_PUBLIC_YANDEX_METRICA_ID: ${{ vars.NEXT_PUBLIC_YANDEX_METRICA_ID }}
          NEXT_PUBLIC_METRIKA_INFORMER: ${{ vars.NEXT_PUBLIC_METRIKA_INFORMER }}
          # Включает output:'standalone' (next.config.js).
          STANDALONE_BUILD: '1'
        run: pnpm build

      - name: Assemble standalone bundle
        working-directory: web
        run: |
          set -e
          if [ ! -f .next/standalone/server.js ]; then
            echo "::error::server.js не в корне .next/standalone — проверь outputFileTracingRoot"
            find .next/standalone -maxdepth 3 -name server.js || true
            exit 1
          fi
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          tar czf ../dkmalmyzh-app.tgz -C .next/standalone .
          echo "bundle: $(du -h ../dkmalmyzh-app.tgz | cut -f1)"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -e
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_PORT" ]; then
            echo "::error::Заданы не все: secrets.SSH_PRIVATE_KEY / secrets.DEPLOY_SSH_HOST / vars.DEPLOY_SSH_PORT"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_dkmalmyzh
          chmod 600 ~/.ssh/id_ed25519_dkmalmyzh
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host dkmalmyzh
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User valstan
            IdentityFile ~/.ssh/id_ed25519_dkmalmyzh
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Ship artifact + restart
        run: |
          set -e
          scp -q dkmalmyzh-app.tgz dkmalmyzh:/tmp/dkmalmyzh-app.tgz
          ssh dkmalmyzh 'bash -s' "${{ github.sha }}" <<'REMOTE'
          set -e
          SHA="$1"
          BASE=/home/valstan/dkmalmyzh
          REL="$BASE/releases/$SHA"
          rm -rf "$REL"; mkdir -p "$REL"
          tar xzf /tmp/dkmalmyzh-app.tgz -C "$REL"
          rm -f /tmp/dkmalmyzh-app.tgz
          # Персистентное медиа: staticDir = <release>/public/media лежит внутри
          # релиз-директории, которую деплой пересоздаёт. Подменяем на симлинк в
          # общий каталог $BASE/shared/media, переживающий релизы. На проде также
          # MEDIA_DIR в /etc/dkmalmyzh/dkmalmyzh.env может указывать сюда же.
          mkdir -p "$BASE/shared/media"
          rm -rf "$REL/public/media"
          ln -sfn "$BASE/shared/media" "$REL/public/media"
          ln -sfn "$REL" "$BASE/current"
          sudo systemctl restart dkmalmyzh
          # держим последние 5 релизов
          ls -1dt "$BASE"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
          echo "deployed $SHA"
          REMOTE

      # Юниты импорта из ВК. Ставятся каждым деплоем идемпотентно: файл меняется —
      # daemon-reload и рестарт таймера, не меняется — не трогаем. Таймер включаем
      # только когда в env-файле есть и токен, и секрет: без них каждый прогон
      # писал бы в журнал отказ и выглядел как поломка.
      - name: Установить таймер импорта из ВК
        run: |
          set -e
          scp -q deploy/dkmalmyzh-vk-sync.service deploy/dkmalmyzh-vk-sync.timer dkmalmyzh:/tmp/
          ssh dkmalmyzh 'bash -s' <<'REMOTE'
          set -e
          changed=0
          for unit in dkmalmyzh-vk-sync.service dkmalmyzh-vk-sync.timer; do
            if ! sudo cmp -s "/tmp/$unit" "/etc/systemd/system/$unit"; then
              sudo cp "/tmp/$unit" "/etc/systemd/system/$unit"
              changed=1
            fi
            rm -f "/tmp/$unit"
          done
          [ "$changed" = "1" ] && sudo systemctl daemon-reload || true

          # Значения читаем, но НЕ печатаем: журнал прогона публичный.
          have_token=0; have_secret=0
          # `|| true` обязателен: под `set -e` неудачный grep (переменной нет —
          # штатный случай) уронил бы весь шаг деплоя.
          sudo grep -q '^VK_SERVICE_TOKEN=.' /etc/dkmalmyzh/dkmalmyzh.env && have_token=1 || true
          sudo grep -q '^VK_SYNC_SECRET=.' /etc/dkmalmyzh/dkmalmyzh.env && have_secret=1 || true
          if [ "$have_token" = "1" ] && [ "$have_secret" = "1" ]; then
            sudo systemctl enable --now dkmalmyzh-vk-sync.timer
            echo "таймер импорта из ВК включён: $(systemctl is-active dkmalmyzh-vk-sync.timer)"
          else
            sudo systemctl disable --now dkmalmyzh-vk-sync.timer 2>/dev/null || true
            echo "VK_SERVICE_TOKEN и/или VK_SYNC_SECRET не заданы — таймер импорта выключен"
          fi
          REMOTE

      - name: Smoke check — local routes (/, /news, /admin)
        run: |
          set -e
          ssh dkmalmyzh 'bash -s' <<'REMOTE'
          set -e
          sleep 6   # дать сервису подняться после systemctl restart
          fail=0
          check() {
            path="$1"; expected="$2"
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://127.0.0.1:3005$path" || true)
            echo "local $path → $status (ожидалось: $expected)"
            case " $expected " in
              *" $status "*) ;;
              *) echo "::error::local $path = $status, ожидалось одно из: $expected"; fail=1 ;;
            esac
          }
          check "/"      "200"
          check "/news"  "200"
          # /admin без сессии отдаёт экран входа (200) или редирект — главное, не 5xx/000.
          check "/admin" "200 302 307 308"
          exit $fail
          REMOTE

      # Публикация наружу: vhost домкультуры.вмалмыже.рф → :3005. Идемпотентно —
      # ставим только при отличии от того, что уже лежит на боксе.
      # Версию выбираем по факту: есть LE-сертификат домена → TLS-конфиг, нет →
      # бутстрап на :80 (редирект на https без сертификата увёл бы посетителей
      # на 443 default_server соседнего сайта).
      - name: Install/refresh nginx vhost
        run: |
          set -e
          scp -q deploy/nginx-dkmalmyzh.conf dkmalmyzh:/tmp/nginx-dkmalmyzh-http.conf
          scp -q deploy/nginx-dkmalmyzh-tls.conf dkmalmyzh:/tmp/nginx-dkmalmyzh-tls.conf
          ssh dkmalmyzh 'bash -s' <<'REMOTE'
          set -e
          DOMAIN=xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai
          # Webroot для ACME — в /var/www: домашний каталог пользователя закрыт
          # для nginx-воркера, оттуда челлендж отдавался 404.
          sudo mkdir -p /var/www/dkmalmyzh-acme && sudo chmod 755 /var/www/dkmalmyzh-acme
          if sudo test -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem"; then
            SRC=/tmp/nginx-dkmalmyzh-tls.conf
            echo "сертификат найден → ставим TLS-версию vhost"
          else
            SRC=/tmp/nginx-dkmalmyzh-http.conf
            echo "сертификата ещё нет → ставим бутстрап-версию (:80). Выпуск: workflow setup-tls.yml"
          fi
          cp "$SRC" /tmp/nginx-dkmalmyzh.conf
          if [ -d /etc/nginx/sites-available ]; then
            DEST=/etc/nginx/sites-available/dkmalmyzh.conf
            ENABLE=/etc/nginx/sites-enabled/dkmalmyzh.conf
          else
            DEST=/etc/nginx/conf.d/dkmalmyzh.conf
            ENABLE=
          fi
          if sudo cmp -s /tmp/nginx-dkmalmyzh.conf "$DEST" 2>/dev/null; then
            echo "vhost без изменений"
          else
            sudo cp /tmp/nginx-dkmalmyzh.conf "$DEST"
            if [ -n "$ENABLE" ]; then sudo ln -sfn "$DEST" "$ENABLE"; fi
            sudo nginx -t
            sudo systemctl reload nginx
            echo "vhost обновлён, nginx перечитан"
          fi
          rm -f /tmp/nginx-dkmalmyzh.conf /tmp/nginx-dkmalmyzh-http.conf /tmp/nginx-dkmalmyzh-tls.conf
          REMOTE

      # Проверяем путь через nginx под боевым Host. Голый код 200 ничего не
      # доказывает: бокс делят несколько сайтов, и 200 отдал бы сосед. Поэтому
      # обязателен контент-маркер нашей главной.
      - name: Smoke check — через nginx под боевым Host
        run: |
          set -e
          ssh dkmalmyzh 'bash -s' <<'REMOTE'
          set -e
          DOMAIN=xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai
          H="Host: $DOMAIN"
          if sudo test -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem"; then
            URL="https://127.0.0.1/"; EXTRA="--resolve $DOMAIN:443:127.0.0.1"; URL="https://$DOMAIN/"
          else
            URL="http://127.0.0.1/"; EXTRA=""
          fi
          code=$(curl -sk $EXTRA -o /tmp/smoke.html -w '%{http_code}' --max-time 15 -H "$H" "$URL")
          echo "nginx $URL → $code"
          [ "$code" = "200" ] || { echo "::error::через nginx ожидался 200"; exit 1; }
          # Маркер сменился с «РЦКД» на «Малмыж»: сайт стал районным порталом, и
          # аббревиатура головного учреждения ушла с главной в свой раздел /dk.
          # «Малмыж» есть и в названии портала, и в шапке — устойчивее к правкам
          # редактором, чем конкретная строка глобала.
          if grep -q "Малмыж" /tmp/smoke.html; then
            echo "content marker OK: «Малмыж» на главной"
          else
            echo "::error::контент-маркер не найден — под боевым Host отвечает не наш сайт"
            grep -oiE "<title>[^<]*</title>" /tmp/smoke.html | head -1 || true
            exit 1
          fi
          rm -f /tmp/smoke.html

          # Прежний домен обязан отдавать 301 на портал. Без этой проверки
          # переключение доменов не проверяет никто: сайт на новом имени зелёный,
          # а старые ссылки могут молча уходить на default_server соседа.
          LEGACY=xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai
          loc=$(curl -sk --resolve "$LEGACY:443:127.0.0.1" -o /dev/null -w '%{http_code} %{redirect_url}'                 --max-time 15 "https://$LEGACY/")
          echo "прежний домен / → $loc"
          case "$loc" in
            301*"xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/dk/rckd") echo "редирект корня прежнего домена OK" ;;
            *) echo "::error::прежний домен не отдаёт 301 на раздел РЦКД: $loc"; exit 1 ;;
          esac

          deep=$(curl -sk --resolve "$LEGACY:443:127.0.0.1" -o /dev/null -w '%{http_code} %{redirect_url}'                  --max-time 15 "https://$LEGACY/news")
          echo "прежний домен /news → $deep"
          case "$deep" in
            301*"xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/news") echo "глубокая ссылка сохраняет путь OK" ;;
            *) echo "::error::глубокая ссылка прежнего домена не сохраняет путь: $deep"; exit 1 ;;
          esac
          REMOTE

      - name: On failure — журналы прода
        if: failure()
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          # Лог прогона публичный (D-038), а журнал прода несёт хостнейм в префиксе
          # каждой строки, путь юнита в `Loaded:` и целую DATABASE_URI в ошибке
          # подключения к БД. Поэтому: `is-active` вместо полного `systemctl status`,
          # `-o cat` вместо дефолтного формата (снимает префикс «дата хост юнит[pid]»)
          # и фильтр на выходе. Фильтр по форме, не по значению: строки подключения
          # режутся до схемы, адрес хоста — по значению из secrets на случай, если он
          # приедет из журнала не тем регистром, каким его маскирует раннер.
          redact() {
            sed -E -e 's#(postgres(ql)?://)[^[:space:]]*#\1<redacted>#g' \
                   -e "s#${DEPLOY_SSH_HOST}#<host>#g"
          }
          ssh dkmalmyzh "systemctl is-active dkmalmyzh; systemctl show dkmalmyzh -p ActiveState,SubState,Result,ExecMainStatus" 2>&1 | redact || true
          ssh dkmalmyzh "sudo journalctl -u dkmalmyzh -n 80 --no-pager -o cat" 2>&1 | redact || true
