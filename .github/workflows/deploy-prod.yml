name: Deploy to production

# Сборка едет в CI (ubuntu), т.к. прод-VPS (мало RAM) не тянет next build.
# На сервер по SSH кладём готовый standalone-артефакт и рестартим systemd-сервис.
#
# Требуется:
#   secrets.SSH_PRIVATE_KEY        — приватная часть деплой-ключа
#   secrets.DATABASE_URI           — строка подключения к прод-БД (для CI-сборки НЕ нужна — там эфемерная; здесь не используется на сборке, но имя зарезервировано для будущих шагов)
#   secrets.PAYLOAD_SECRET         — секрет Payload (на рантайме читается из /etc/dkmalmyzh/dkmalmyzh.env)
#   secrets.DEPLOY_SSH_HOST        — хост прод-сервера. Именно secret, а не var (D-038):
#                                    значения vars раскрываются в публичном логе прогона,
#                                    маскируются только secrets.
#   vars.DEPLOY_SSH_PORT           — внешний SSH-порт. Осознанно оставлен в vars: значение
#                                    стандартное и сверхкороткое, а маскируется КАЖДОЕ его
#                                    вхождение — в secrets оно замазало бы пол-лога.
#   vars.NEXT_PUBLIC_SERVER_URL    — боевой домен (punycode домкультуры.вмалмыже.рф; бейкается в бандл при сборке)
#   vars.NEXT_PUBLIC_YANDEX_METRICA_ID — номер счётчика Метрики (D-017); пусто → тег не рендерится
#   vars.NEXT_PUBLIC_METRIKA_INFORMER  — '1' → видимый информер в подвале (только после включения настройки в кабинете)

on:
  push:
    branches: [main]
    # docs/почта/markdown/инфра не трогают прод-артефакт — не гоняем пересборку+рестарт зря.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # id-token — паспорт КАРМАНа (ADR-0012, D-061): шаг «Ключи шлюза из vault по
    # паспорту» предъявляет OIDC-удостоверение прогона вместо хранимого токена.
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dkmalmyzh_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Предохранитель миграций. Стандартный standalone-бандл не несёт payload CLI,
      # поэтому миграции применяются на проде ВРУЧНУЮ (apply-migration.yml: psql -f
      # .sql + запись в payload_migrations) ДО деплоя кода. Ручной workflow_dispatch
      # означает «уже применил» — там guard пропускается.
      #
      # Гейт сверяет миграции репозитория с РЕЕСТРОМ НА ПРОДЕ, а не с прошлым
      # коммитом.
      #
      # Прежняя версия смотрела только `HEAD~1..HEAD` и потому останавливала ровно
      # тот коммит, который миграцию вносит. Следующий коммит нёс тот же
      # неприменённый код дальше — и деплоился спокойно. Поймано 31.08 на живом
      # проде: миграция institutions осталась неприменённой, код, который её
      # требует, уехал следующим же PR, `/api/posts` и `/api/institutions` начали
      # отдавать 500, а публичные страницы держались только на мягкой деградации —
      # то есть снаружи поломка была почти не видна.
      #
      # Источник правды о применённом — таблица payload_migrations на проде.
      # Нечитаемый реестр останавливает деплой: «не смогли проверить» здесь не
      # то же самое, что «всё в порядке».
      - name: Migration guard
        if: github.event_name != 'workflow_dispatch'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_guard
          chmod 600 ~/.ssh/id_ed25519_guard
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          set +e
          APPLIED=$(ssh -i ~/.ssh/id_ed25519_guard -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "$DEPLOY_SSH_PORT" "valstan@$DEPLOY_SSH_HOST" 'bash -s' <<'REMOTE'
          set -e
          DB=$(sudo grep '^DATABASE_URI=' /etc/dkmalmyzh/dkmalmyzh.env | head -1 | sed 's/^DATABASE_URI=//;s/^"//;s/"$//')
          [ -n "$DB" ] || exit 3
          psql "$DB" -tAc "SELECT name FROM payload_migrations ORDER BY name;"
          REMOTE
          )
          RC=$?
          set -e
          rm -f ~/.ssh/id_ed25519_guard

          if [ "$RC" -ne 0 ]; then
            echo "::error::реестр миграций на проде не прочитан (код $RC) — деплой остановлен"
            exit 1
          fi

          MISSING=""
          for f in web/src/migrations/*.sql; do
            NAME=$(basename "$f" .sql)
            printf '%s\n' "$APPLIED" | grep -qxF "$NAME" || MISSING="$MISSING $NAME"
          done

          if [ -n "$MISSING" ]; then
            echo "::error::на проде не применены миграции:$MISSING"
            echo "Накати их через apply-migration.yml (по одной), затем запусти деплой через workflow_dispatch."
            exit 1
          fi
          echo "все миграции репозитория есть в реестре прода — деплой продолжается"

      # Дрейф-проба G231 — ОТДЕЛЬНЫМ шагом и БЕЗ условия по событию.
      #
      # Раньше она жила внутри Migration guard, у которого стоит
      # `if: github.event_name != 'workflow_dispatch'`. Это ровно тот путь, которым
      # новая миграция и приезжает на прод: сперва apply-migration.yml, затем деплой
      # через dispatch. То есть проба выключалась именно в том прогоне, ради
      # которого написана, — а деплой оставался зелёным.
      #
      # Класс G231: Payload берёт блокировку при открытии ЛЮБОГО документа и
      # перечисляет в payload_locked_documents_rels все коллекции разом. Коллекция,
      # заведённая ручной миграцией без колонки <slug>_id, кладёт всю админку, при
      # этом список таблиц не меняется — гейт по именам таблиц молчит.
      #
      # Список коллекций берём из массива `collections` в payload.config.ts, а не
      # globом по каталогу: коллекция может лежать в подкаталоге или быть объявлена
      # мимо каталога, а файл в каталоге может быть ещё не подключён к конфигу.
      # Slug, который не удалось извлечь, — ошибка шага, а не `continue`: молчаливый
      # пропуск неотличим от успеха.
      - name: Дрейф-проба G231 (payload_locked_documents_rels)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_drift
          chmod 600 ~/.ssh/id_ed25519_drift
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cleanup() { rm -f ~/.ssh/id_ed25519_drift; }
          trap cleanup EXIT
          trap 'cleanup; exit 130' INT TERM

          # Имена коллекций, зарегистрированных в конфиге.
          REGISTERED=$(sed -nE 's/^[[:space:]]*collections:[[:space:]]*\[(.*)\].*/\1/p' web/src/payload.config.ts | tr ',' '\n' | tr -d ' ')
          [ -n "$REGISTERED" ] || { echo "::error::не разобрал массив collections в payload.config.ts"; exit 1; }

          SLUGS=""
          for name in $REGISTERED; do
            file=$(grep -rlE "^[[:space:]]*(export )?const $name" web/src/collections | head -1 || true)
            [ -n "$file" ] || { echo "::error::коллекция $name объявлена в конфиге, но её файл не найден"; exit 1; }
            slug=$(sed -nE "s/^[[:space:]]*slug:[[:space:]]*['\"]([A-Za-z0-9_-]+)['\"].*/\1/p" "$file" | head -1)
            [ -n "$slug" ] || { echo "::error::в $file не удалось прочитать slug коллекции $name — проба не может ручаться за G231"; exit 1; }
            SLUGS="$SLUGS $slug"
          done
          NSLUGS=$(printf '%s\n' $SLUGS | grep -c . || true)
          echo "коллекций в конфиге: $NSLUGS ($SLUGS )"

          LOCKED_COLS=$(ssh -i ~/.ssh/id_ed25519_drift -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "$DEPLOY_SSH_PORT" "valstan@$DEPLOY_SSH_HOST" 'bash -s' <<'REMOTE'
          set -e
          DB=$(sudo grep '^DATABASE_URI=' /etc/dkmalmyzh/dkmalmyzh.env | head -1 | sed 's/^DATABASE_URI=//;s/^"//;s/"$//')
          [ -n "$DB" ] || exit 3
          psql "$DB" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name = 'payload_locked_documents_rels' ORDER BY column_name;"
          REMOTE
          )
          [ -n "$LOCKED_COLS" ] || { echo "::error::не прочитали колонки payload_locked_documents_rels на проде — «не смогли проверить» это не «всё в порядке»"; exit 1; }

          DRIFT=""
          for slug in $SLUGS; do
            COL="$(printf '%s' "$slug" | tr '-' '_')_id"
            printf '%s\n' "$LOCKED_COLS" | grep -qxF "$COL" || DRIFT="$DRIFT $slug"
          done
          NCOLS=$(printf '%s\n' "$LOCKED_COLS" | grep -v '^parent_id$' | grep -c '_id$' || true)

          if [ -n "$DRIFT" ]; then
            echo "::error::G231: в payload_locked_documents_rels нет колонки для коллекций:$DRIFT — админка ляжет при первом открытии документа"
            exit 1
          fi
          if [ "$NCOLS" != "$NSLUGS" ]; then
            echo "::error::G231: колонок *_id на проде $NCOLS, коллекций в конфиге $NSLUGS — расхождение разбирать руками"
            exit 1
          fi
          echo "G231: колонок $NCOLS = коллекций $NSLUGS, чисто"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Generate importmap + types
        working-directory: web
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/dkmalmyzh_build
        run: |
          pnpm generate:importmap
          pnpm generate:types

      - name: Build (standalone)
        working-directory: web
        env:
          # Эфемерная БД CI: push:true создаёт схему здесь, prerender отдаёт пустые
          # страницы (контента в CI нет) — рантайм наполнит через ISR/ревалидацию.
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/dkmalmyzh_build
          PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL || 'http://127.0.0.1:3005' }}
          # Аналитика (D-017). Пусто → тег Метрики и информер не рендерятся;
          # NEXT_PUBLIC_* бейкаются здесь, в бандл, а не читаются в рантайме.
          NEXT_PUBLIC_YANDEX_METRICA_ID: ${{ vars.NEXT_PUBLIC_YANDEX_METRICA_ID }}
          NEXT_PUBLIC_METRIKA_INFORMER: ${{ vars.NEXT_PUBLIC_METRIKA_INFORMER }}
          # Включает output:'standalone' (next.config.js).
          STANDALONE_BUILD: '1'
        run: pnpm build

      - name: Assemble standalone bundle
        working-directory: web
        run: |
          set -e
          if [ ! -f .next/standalone/server.js ]; then
            echo "::error::server.js не в корне .next/standalone — проверь outputFileTracingRoot"
            find .next/standalone -maxdepth 3 -name server.js || true
            exit 1
          fi
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          tar czf ../dkmalmyzh-app.tgz -C .next/standalone .
          echo "bundle: $(du -h ../dkmalmyzh-app.tgz | cut -f1)"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -e
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_PORT" ]; then
            echo "::error::Заданы не все: secrets.SSH_PRIVATE_KEY / secrets.DEPLOY_SSH_HOST / vars.DEPLOY_SSH_PORT"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_dkmalmyzh
          chmod 600 ~/.ssh/id_ed25519_dkmalmyzh
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host dkmalmyzh
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User valstan
            IdentityFile ~/.ssh/id_ed25519_dkmalmyzh
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config

      - name: Ship artifact + restart
        run: |
          set -e
          scp -q dkmalmyzh-app.tgz dkmalmyzh:/tmp/dkmalmyzh-app.tgz
          ssh dkmalmyzh 'bash -s' "${{ github.sha }}" <<'REMOTE'
          set -e
          SHA="$1"
          BASE=/home/valstan/dkmalmyzh
          REL="$BASE/releases/$SHA"
          rm -rf "$REL"; mkdir -p "$REL"
          tar xzf /tmp/dkmalmyzh-app.tgz -C "$REL"
          rm -f /tmp/dkmalmyzh-app.tgz
          # Персистентное медиа: staticDir = <release>/public/media лежит внутри
          # релиз-директории, которую деплой пересоздаёт. Подменяем на симлинк в
          # общий каталог $BASE/shared/media, переживающий релизы. На проде также
          # MEDIA_DIR в /etc/dkmalmyzh/dkmalmyzh.env может указывать сюда же.
          mkdir -p "$BASE/shared/media"
          rm -rf "$REL/public/media"
          ln -sfn "$BASE/shared/media" "$REL/public/media"
          ln -sfn "$REL" "$BASE/current"
          sudo systemctl restart dkmalmyzh
          # держим последние 5 релизов
          ls -1dt "$BASE"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
          echo "deployed $SHA"
          REMOTE

      # Ключи шлюза SARAFAN — из vault КАРМАНа по ПАСПОРТУ (ADR-0012, D-061, мандат
      # Мозга 03.09). Хранимого токена комнаты нет и не будет: шаг предъявляет
      # OIDC-удостоверение прогона, получает сессионный токен на час, забирает
      # GATEWAY_KEY_DKMALMYZH и ECOSYSTEM_KEY (grant'ы от Сарафана с 01.09), кладёт
      # их в env-файл бокса и отзывает сессию.
      #
      # Три условия КАРМАНа: audience ровно `karman-vault`; прогон с refs/heads/main
      # (push в main и dispatch на main — оба подходят, PR-прогон получит 401 по
      # построению); самоотзыв сессии — в trap, не последней строкой.
      #
      # Две мины (G291, G292): токен приходит ОТВЕТОМ, GitHub его не маскирует —
      # `::add-mask::` до первого использования; и один `trap … EXIT` на шаг —
      # второй молча заменяет первый, и самоотзыв пропал бы.
      #
      # `continue-on-error` — до первого успеха: пока КАРМАН не завёл нашу
      # личность, `/session` отвечает 403, а деплой обязан оставаться зелёным.
      # Но молчаливого «ок» здесь нет: каждый исход печатается предупреждением.
      #
      # Проверка ключа — С БОКСА, не с раннера: у соседей curl с раннера до Сетки
      # уходил в таймаут. Проба настоящая: свой ключ читает стену Калининского СДК
      # (owner_id, не domain= — иначе 403 по привязке), чужой ключ получает 401.
      - name: Ключи шлюза из vault по паспорту
        continue-on-error: true
        env:
          VAULT_URL: ${{ secrets.VAULT_URL }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$VAULT_URL" ] || [ -z "$GATEWAY_URL" ]; then
            echo "::warning::secrets.VAULT_URL / secrets.GATEWAY_URL не заданы — ключи шлюза не забираются"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::OIDC недоступен (permissions: id-token: write) — паспорт пропущен"
            exit 1
          fi

          ASSERTION="$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=karman-vault" | jq -r '.value // empty')"
          [ -n "$ASSERTION" ] || { echo "::warning::удостоверение прогона не выдано"; exit 1; }
          echo "::add-mask::$ASSERTION"

          scode=$(curl -s -o session.json -w '%{http_code}' --max-time 20 -X POST \
            "$VAULT_URL/api/secrets/session" -H "Authorization: Bearer $ASSERTION") || scode="curl-exit-$?"
          case "$scode" in
            201) ;;
            403) echo "::warning::vault 403 — личность DKMalmyzh ещё не заведена в КАРМАНе (мандат ушёл 03.09); ждём строки «личность заведена»"; rm -f session.json; exit 1 ;;
            401) echo "::warning::vault 401 — удостоверение отклонено (ветка не main / срок / повтор)"; rm -f session.json; exit 1 ;;
            *)   echo "::warning::vault /session → $scode"; rm -f session.json; exit 1 ;;
          esac
          TOKEN="$(jq -r '.token // empty' session.json)"
          CANWRITE="$(jq -r '.canWrite // false' session.json)"
          rm -f session.json
          [ -n "$TOKEN" ] || { echo "::warning::201, но token пуст"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "сессия vault открыта (canWrite=$CANWRITE)"

          # Один trap на сигнал: самоотзыв сессии, уборка временных файлов на
          # раннере И на боксе. Файлы с живым ключом уезжают в /tmp общего бокса,
          # где живут соседние сайты, а удаление внутри удалённого скрипта не
          # выполнится, если сессия оборвётся раньше — поэтому чистим отсюда тоже.
          cleanup() {
            curl -sS -X DELETE "$VAULT_URL/api/secrets/session" -H "Authorization: Bearer $TOKEN" \
              -o /dev/null -w 'DELETE /session → %{http_code}\n' 2>/dev/null || true
            ssh -o ConnectTimeout=10 dkmalmyzh 'rm -f /tmp/gw-key.txt /tmp/gw-body.json /tmp/gw-wall.json /tmp/gw.env /tmp/gw-url.txt' >/dev/null 2>&1 || true
            rm -f session.json resp.json gw-key.txt eco-key.txt gw.env body.json gw-url.txt
          }
          trap cleanup EXIT
          # Обработчик сигнала в bash отрабатывает и ВОЗВРАЩАЕТ исполнение на
          # следующую команду. Без явного exit отменённый прогон продолжил бы шаг
          # уже без файлов ключей и записал бы в прод-env пустые значения.
          trap 'cleanup; exit 130' INT TERM INT TERM

          fetch_key() {
            local name="$1" out="$2" code
            code=$(curl -s -o resp.json -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $TOKEN" "$VAULT_URL/api/secrets?key=$name") || code="curl-exit-$?"
            echo "vault $name: HTTP $code"
            [ "$code" = "200" ] || { echo "::warning::$name не прочитан (404 = grant не виден комнате)"; return 1; }
            local val; val=$(jq -r ".secrets.$name // empty" resp.json); rm -f resp.json
            [ -n "$val" ] || { echo "::warning::$name: 200, но значение пустое"; return 1; }
            echo "::add-mask::$val"
            printf '%s' "$val" > "$out"
            # Ни длины, ни префикса хеша: маска закрывает само значение, но не
            # производные от него, а лог публичный. Префикс sha256 работал бы
            # офлайн-оракулом для проверки украденного кандидата без обращения к
            # шлюзу, а длина сужает перебор. Достаточно факта получения.
            echo "$name: получен"
          }
          fetch_key GATEWAY_KEY_DKMALMYZH gw-key.txt
          fetch_key ECOSYSTEM_KEY eco-key.txt

          # Проба на шлюзе с бокса, которая краснеет.
          #
          # Адрес шлюза едет файлом, а не аргументом ssh: аргумент склеивается в
          # командную строку удалённого процесса и виден соседям по общему боксу в
          # `ps`, а также попадает в аудит-логи sshd. В env-файле прода (640) этот
          # адрес соседям недоступен — argv расширил бы круг читателей. Заодно
          # снимается разбор спецсимволов адреса удалённым шеллом.
          echo '{"method":"wall.get","params":{"owner_id":-218991929,"count":1}}' > body.json
          printf '%s' "$GATEWAY_URL" > gw-url.txt
          scp -q gw-key.txt dkmalmyzh:/tmp/gw-key.txt
          scp -q body.json dkmalmyzh:/tmp/gw-body.json
          scp -q gw-url.txt dkmalmyzh:/tmp/gw-url.txt
          ssh dkmalmyzh 'bash -s' <<'REMOTE'
          set -eo pipefail
          # Свой trap на удалённой стороне: обрыв ssh-сессии убивает этот bash, и
          # без trap файл с живым ключом остался бы в /tmp общего бокса навсегда.
          trap 'rm -f /tmp/gw-key.txt /tmp/gw-body.json /tmp/gw-wall.json /tmp/gw-url.txt' EXIT INT TERM
          GW=$(cat /tmp/gw-url.txt)
          KEY=$(cat /tmp/gw-key.txt)
          code=$(curl -s -o /tmp/gw-wall.json -w '%{http_code}' --max-time 60 \
            -X POST "$GW/api/gateway/call" -H "X-API-Key: $KEY" \
            -H 'Content-Type: application/json' --data-binary @/tmp/gw-body.json) || code="curl-exit-$?"
          echo "wall.get своим ключом: HTTP $code"
          if [ "$code" != "200" ] || ! grep -q '"ok": *true' /tmp/gw-wall.json; then
            # Тело ответа в публичный лог не печатаем: это ответ ЧУЖОЙ
            # инфраструктуры, и в самом вероятном сценарии отказа (шлюз за прокси
            # отдал 502, приложение — ECONNREFUSED) там лежит внутренний адрес или
            # имя апстрима, которых D-038 в публичном логе быть не должно.
            # Печатаем форму: код, размер и поле error, если оно есть.
            echo "::warning::шлюз не принял ключ: HTTP $code, тело $(wc -c < /tmp/gw-wall.json) байт"
            grep -o '"error"[^,}]*' /tmp/gw-wall.json | head -1 | cut -c1-80 || true
            exit 1
          fi
          WRONG_KEY=$(printf 'wrong-%s' "$RANDOM")
          bad=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            -X POST "$GW/api/gateway/call" -H "X-API-Key: $WRONG_KEY" \
            -H 'Content-Type: application/json' --data-binary @/tmp/gw-body.json) || bad="curl-exit-$?"
          echo "wall.get неверным ключом: HTTP $bad"
          [ "$bad" = "401" ] || { echo "::warning::неверный ключ не отвергнут ($bad) — проба ничего не доказывает"; exit 1; }
          echo "ключ читает стену, чужой ключ получает 401"
          REMOTE

          # Запись в env бокса — идемпотентно. INTERNAL_OPS_SECRET, если его ещё нет,
          # генерируется на месте: это секрет запуска служебных маршрутов, значение
          # нужно только боксу. Рестарт — чтобы приложение и таймер прочитали env.
          #
          # Перед записью — проверка непустых файлов. `echo "КЛЮЧ=$(cat f)"` под
          # `set -e` шаг НЕ роняет (статусом остаётся статус echo), поэтому пустой
          # или исчезнувший файл тихо превратился бы в `SARAFAN_GATEWAY_KEY=`, а
          # запись на боксе сперва удаляет действующие строки и только потом
          # дописывает приехавшие — прод остался бы без ключа шлюза.
          [ -s gw-key.txt ] && [ -s eco-key.txt ] || {
            echo "::warning::файлы ключей пусты — в env ничего не пишем"
            exit 1
          }
          {
            echo "SARAFAN_GATEWAY_URL=$GATEWAY_URL"
            echo "SARAFAN_GATEWAY_KEY=$(cat gw-key.txt)"
            echo "ECOSYSTEM_KEY=$(cat eco-key.txt)"
          } > gw.env
          scp -q gw.env dkmalmyzh:/tmp/gw.env
          ssh dkmalmyzh 'sudo bash -s' <<'REMOTE'
          set -e
          trap 'rm -f /tmp/gw.env' EXIT INT TERM
          ENV=/etc/dkmalmyzh/dkmalmyzh.env
          test -f "$ENV" || { echo "::warning::$ENV нет"; exit 1; }
          # Второй рубеж против пустого значения: до sed -i, который вырезает
          # действующие строки. Строка вида `КЛЮЧ=` в приехавшем файле означает,
          # что на раннере что-то пошло не так, и переписывать env нельзя.
          if grep -qE '^(SARAFAN_GATEWAY_KEY|ECOSYSTEM_KEY|SARAFAN_GATEWAY_URL)=$' /tmp/gw.env; then
            echo "::warning::в приехавшем файле есть пустое значение — env не трогаем"
            exit 1
          fi
          if cmp -s <(grep -E '^(SARAFAN_GATEWAY_URL|SARAFAN_GATEWAY_KEY|ECOSYSTEM_KEY)=' "$ENV" | sort) <(sort /tmp/gw.env) \
             && grep -q '^INTERNAL_OPS_SECRET=.' "$ENV"; then
            echo "env без изменений — рестарт не нужен"
            exit 0
          fi
          sed -i '/^SARAFAN_GATEWAY_URL=/d; /^SARAFAN_GATEWAY_KEY=/d; /^ECOSYSTEM_KEY=/d' "$ENV"
          cat /tmp/gw.env >> "$ENV"
          if ! grep -q '^INTERNAL_OPS_SECRET=.' "$ENV"; then
            echo "INTERNAL_OPS_SECRET=$(openssl rand -hex 32)" >> "$ENV"
            echo "INTERNAL_OPS_SECRET сгенерирован"
          fi
          chmod 640 "$ENV"
          systemctl restart dkmalmyzh
          echo "env обновлён, dkmalmyzh перезапущен"
          REMOTE

      # Юниты импорта из ВК. Ставятся каждым деплоем идемпотентно: файл меняется —
      # daemon-reload и рестарт таймера, не меняется — не трогаем. Таймер включаем
      # только когда в env-файле есть ключ шлюза SARAFAN и секрет запуска: без них
      # каждый прогон писал бы в журнал отказ и выглядел как поломка.
      - name: Установить таймер импорта из ВК
        run: |
          set -e
          scp -q deploy/dkmalmyzh-vk-sync.service deploy/dkmalmyzh-vk-sync.timer deploy/dkmalmyzh-vk-sync-run.sh dkmalmyzh:/tmp/
          ssh dkmalmyzh 'bash -s' <<'REMOTE'
          set -e
          changed=0
          for unit in dkmalmyzh-vk-sync.service dkmalmyzh-vk-sync.timer; do
            if ! sudo cmp -s "/tmp/$unit" "/etc/systemd/system/$unit"; then
              sudo cp "/tmp/$unit" "/etc/systemd/system/$unit"
              changed=1
            fi
            rm -f "/tmp/$unit"
          done
          # Обёртка запуска: юнит зовёт её, а не голый curl (тело ответа и трактовка 409).
          if ! sudo cmp -s /tmp/dkmalmyzh-vk-sync-run.sh /usr/local/bin/dkmalmyzh-vk-sync-run.sh; then
            sudo cp /tmp/dkmalmyzh-vk-sync-run.sh /usr/local/bin/dkmalmyzh-vk-sync-run.sh
            sudo chmod 755 /usr/local/bin/dkmalmyzh-vk-sync-run.sh
          fi
          rm -f /tmp/dkmalmyzh-vk-sync-run.sh
          [ "$changed" = "1" ] && sudo systemctl daemon-reload || true

          # Значения читаем, но НЕ печатаем: журнал прогона публичный.
          have_token=0; have_secret=0
          # `|| true` обязателен: под `set -e` неудачный grep (переменной нет —
          # штатный случай) уронил бы весь шаг деплоя.
          sudo grep -q '^SARAFAN_GATEWAY_KEY=.' /etc/dkmalmyzh/dkmalmyzh.env && have_token=1 || true
          sudo grep -q '^INTERNAL_OPS_SECRET=.' /etc/dkmalmyzh/dkmalmyzh.env && have_secret=1 || true
          if [ "$have_token" = "1" ] && [ "$have_secret" = "1" ]; then
            sudo systemctl enable --now dkmalmyzh-vk-sync.timer
            echo "таймер импорта из ВК включён: $(systemctl is-active dkmalmyzh-vk-sync.timer)"
          else
            sudo systemctl disable --now dkmalmyzh-vk-sync.timer 2>/dev/null || true
            echo "SARAFAN_GATEWAY_KEY и/или INTERNAL_OPS_SECRET не заданы — таймер импорта выключен"
          fi
          REMOTE

      - name: Smoke check — local routes (/, /news, /admin)
        run: |
          set -e
          ssh dkmalmyzh 'bash -s' <<'REMOTE'
          set -e
          sleep 6   # дать сервису подняться после systemctl restart
          fail=0
          check() {
            path="$1"; expected="$2"
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://127.0.0.1:3005$path" || true)
            echo "local $path → $status (ожидалось: $expected)"
            case " $expected " in
              *" $status "*) ;;
              *) echo "::error::local $path = $status, ожидалось одно из: $expected"; fail=1 ;;
            esac
          }
          check "/"      "200"
          check "/news"  "200"
          # /admin без сессии отдаёт экран входа (200) или редирект — главное, не 5xx/000.
          check "/admin" "200 302 307 308"
          exit $fail
          REMOTE

      # Публикация наружу: vhost домкультуры.вмалмыже.рф → :3005. Идемпотентно —
      # ставим только при отличии от того, что уже лежит на боксе.
      # Версию выбираем по факту: есть LE-сертификат домена → TLS-конфиг, нет →
      # бутстрап на :80 (редирект на https без сертификата увёл бы посетителей
      # на 443 default_server соседнего сайта).
      - name: Install/refresh nginx vhost
        run: |
          set -e
          scp -q deploy/nginx-dkmalmyzh.conf dkmalmyzh:/tmp/nginx-dkmalmyzh-http.conf
          scp -q deploy/nginx-dkmalmyzh-tls.conf dkmalmyzh:/tmp/nginx-dkmalmyzh-tls.conf
          ssh dkmalmyzh 'bash -s' <<'REMOTE'
          set -e
          DOMAIN=xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai
          # Webroot для ACME — в /var/www: домашний каталог пользователя закрыт
          # для nginx-воркера, оттуда челлендж отдавался 404.
          sudo mkdir -p /var/www/dkmalmyzh-acme && sudo chmod 755 /var/www/dkmalmyzh-acme
          if sudo test -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem"; then
            SRC=/tmp/nginx-dkmalmyzh-tls.conf
            echo "сертификат найден → ставим TLS-версию vhost"
          else
            SRC=/tmp/nginx-dkmalmyzh-http.conf
            echo "сертификата ещё нет → ставим бутстрап-версию (:80). Выпуск: workflow setup-tls.yml"
          fi
          cp "$SRC" /tmp/nginx-dkmalmyzh.conf
          if [ -d /etc/nginx/sites-available ]; then
            DEST=/etc/nginx/sites-available/dkmalmyzh.conf
            ENABLE=/etc/nginx/sites-enabled/dkmalmyzh.conf
          else
            DEST=/etc/nginx/conf.d/dkmalmyzh.conf
            ENABLE=
          fi
          if sudo cmp -s /tmp/nginx-dkmalmyzh.conf "$DEST" 2>/dev/null; then
            echo "vhost без изменений"
          else
            sudo cp /tmp/nginx-dkmalmyzh.conf "$DEST"
            if [ -n "$ENABLE" ]; then sudo ln -sfn "$DEST" "$ENABLE"; fi
            sudo nginx -t
            sudo systemctl reload nginx
            echo "vhost обновлён, nginx перечитан"
          fi
          rm -f /tmp/nginx-dkmalmyzh.conf /tmp/nginx-dkmalmyzh-http.conf /tmp/nginx-dkmalmyzh-tls.conf
          REMOTE

      # Проверяем путь через nginx под боевым Host. Голый код 200 ничего не
      # доказывает: бокс делят несколько сайтов, и 200 отдал бы сосед. Поэтому
      # обязателен контент-маркер нашей главной.
      - name: Smoke check — через nginx под боевым Host
        run: |
          set -e
          ssh dkmalmyzh 'bash -s' <<'REMOTE'
          set -e
          DOMAIN=xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai
          H="Host: $DOMAIN"
          if sudo test -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem"; then
            URL="https://127.0.0.1/"; EXTRA="--resolve $DOMAIN:443:127.0.0.1"; URL="https://$DOMAIN/"
          else
            URL="http://127.0.0.1/"; EXTRA=""
          fi
          code=$(curl -sk $EXTRA -o /tmp/smoke.html -w '%{http_code}' --max-time 15 -H "$H" "$URL")
          echo "nginx $URL → $code"
          [ "$code" = "200" ] || { echo "::error::через nginx ожидался 200"; exit 1; }
          # Маркер сменился с «РЦКД» на «Малмыж»: сайт стал районным порталом, и
          # аббревиатура головного учреждения ушла с главной в свой раздел /dk.
          # «Малмыж» есть и в названии портала, и в шапке — устойчивее к правкам
          # редактором, чем конкретная строка глобала.
          if grep -q "Малмыж" /tmp/smoke.html; then
            echo "content marker OK: «Малмыж» на главной"
          else
            echo "::error::контент-маркер не найден — под боевым Host отвечает не наш сайт"
            grep -oiE "<title>[^<]*</title>" /tmp/smoke.html | head -1 || true
            exit 1
          fi
          rm -f /tmp/smoke.html

          # Прежний домен обязан отдавать 301 на портал. Без этой проверки
          # переключение доменов не проверяет никто: сайт на новом имени зелёный,
          # а старые ссылки могут молча уходить на default_server соседа.
          LEGACY=xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai
          loc=$(curl -sk --resolve "$LEGACY:443:127.0.0.1" -o /dev/null -w '%{http_code} %{redirect_url}'                 --max-time 15 "https://$LEGACY/")
          echo "прежний домен / → $loc"
          case "$loc" in
            301*"xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/dk/rckd") echo "редирект корня прежнего домена OK" ;;
            *) echo "::error::прежний домен не отдаёт 301 на раздел РЦКД: $loc"; exit 1 ;;
          esac

          deep=$(curl -sk --resolve "$LEGACY:443:127.0.0.1" -o /dev/null -w '%{http_code} %{redirect_url}'                  --max-time 15 "https://$LEGACY/news")
          echo "прежний домен /news → $deep"
          case "$deep" in
            301*"xn--80atdujec4e.xn--80adkdyec4j.xn--p1ai/news") echo "глубокая ссылка сохраняет путь OK" ;;
            *) echo "::error::глубокая ссылка прежнего домена не сохраняет путь: $deep"; exit 1 ;;
          esac
          REMOTE

      - name: On failure — журналы прода
        if: failure()
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          # Лог прогона публичный (D-038), а журнал прода несёт хостнейм в префиксе
          # каждой строки, путь юнита в `Loaded:` и целую DATABASE_URI в ошибке
          # подключения к БД. Поэтому: `is-active` вместо полного `systemctl status`,
          # `-o cat` вместо дефолтного формата (снимает префикс «дата хост юнит[pid]»)
          # и фильтр на выходе. Фильтр по форме, не по значению: строки подключения
          # режутся до схемы, адрес хоста — по значению из secrets на случай, если он
          # приедет из журнала не тем регистром, каким его маскирует раннер.
          redact() {
            sed -E -e 's#(postgres(ql)?://)[^[:space:]]*#\1<redacted>#g' \
                   -e "s#${DEPLOY_SSH_HOST}#<host>#g"
          }
          ssh dkmalmyzh "systemctl is-active dkmalmyzh; systemctl show dkmalmyzh -p ActiveState,SubState,Result,ExecMainStatus" 2>&1 | redact || true
          ssh dkmalmyzh "sudo journalctl -u dkmalmyzh -n 80 --no-pager -o cat" 2>&1 | redact || true
