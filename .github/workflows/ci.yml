name: CI

# Гейты проекта (lint + typecheck + build) гоняются здесь, на раннере GitHub, а не
# на машине разработчика: `pnpm build` требует живой Postgres (Payload читает БД на
# пререндере), и держать его локально ради каждого PR не нужно — тут БД эфемерная.
# Сборка прод-артефакта живёт отдельно, в deploy-prod.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dkmalmyzh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: web

    env:
      # Эфемерная БД CI: push:true создаёт схему, пререндер отдаёт пустые страницы.
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/dkmalmyzh_ci
      PAYLOAD_SECRET: ci-build-only-secret-not-used-at-runtime
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3005

    steps:
      - uses: actions/checkout@v5
        with:
          # Сканер секретов смотрит всю историю, а не последний коммит: без
          # fetch-depth: 0 гейт зелен ровно в том сценарии, ради которого ставится.
          fetch-depth: 0

      # Сканер секретов (мандат Мозга 2026-08-17, D-030). Шагом внутри `gates`, а не
      # отдельным workflow: `gates` — уже обязательная проверка `main`, поэтому находка
      # блокирует влитие на сервере с первого же дня, без правки настроек защиты.
      # Стоит до установки зависимостей: падать надо за секунды, а не за двадцать минут.
      # Бинарь с явными флагами вместо gitleaks-action — три обязательных свойства
      # (полная история, --redact, ненулевой exit) видны в файле, а не в умолчаниях обёртки.
      - name: Secret scan (gitleaks)
        working-directory: ${{ github.workspace }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1
          rm -f gitleaks

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate importmap + types
        run: |
          pnpm generate:importmap
          pnpm generate:types

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
