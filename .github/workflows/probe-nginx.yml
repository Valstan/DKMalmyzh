name: Probe nginx (manual, read-only)

# Диагностика публикации домена: какой server-блок реально отвечает на боевой Host.
# Ничего не меняет — только читает. Запускается вручную.
#
# Зачем: сайт живёт на боксе не один — рядом другие сайты портфеля. Проверка
# «curl -H Host … → 200» ничего не доказывает: 200 отдаст и соседний сайт, если
# наш server-блок не загружен. Здесь смотрим `nginx -T` и контент-маркер.

on:
  workflow_dispatch:

concurrency:
  group: probe-nginx
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519_dkmalmyzh
          chmod 600 ~/.ssh/id_ed25519_dkmalmyzh
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<CFG
          Host dkmalmyzh
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User valstan
            IdentityFile ~/.ssh/id_ed25519_dkmalmyzh
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          CFG
          chmod 600 ~/.ssh/config

      - name: Что nginx реально загрузил
        run: |
          ssh dkmalmyzh 'bash -s' <<'REMOTE'
          set +e
          echo "── файл vhost на диске:"
          ls -l /etc/nginx/sites-available/dkmalmyzh.conf /etc/nginx/sites-enabled/dkmalmyzh.conf /etc/nginx/conf.d/dkmalmyzh.conf 2>&1
          echo
          echo "── include-директивы в nginx.conf:"
          grep -n "include" /etc/nginx/nginx.conf
          echo
          # Лог прогона публичный (D-038). Полный дамп server_name с общего бокса —
          # это состав жильцов в открытом виде, поэтому печатаем только свои строки,
          # а про соседей — счётчик и ответ на единственный нужный вопрос: чей
          # default_server. Имена соседних сайтов в лог не идут.
          # Фильтруем по имени файла конфигурации, а не по домену: наш server_name —
          # punycode и слова dkmalmyzh не содержит, грепом по нему свои же строки и потеряли бы.
          echo "── наш блок в загруженной конфигурации (nginx -T):"
          sudo nginx -T 2>/dev/null | awk '/# configuration file/{f=$NF; if (f ~ /dkmalmyzh/) print "── " f; next} f ~ /dkmalmyzh/ && /^[[:space:]]*(server_name|listen)/{sub(/^[[:space:]]+/,""); print}'
          echo
          echo "── соседи по боксу (имена скрыты):"
          sudo nginx -T 2>/dev/null | grep -cE "^\s*server_name" | sed 's/^/server-блоков всего: /'
          # Матчим именно директиву `listen … default_server`, а не любое вхождение слова:
          # nginx -T печатает конфиги вместе с комментариями, и наш же комментарий про
          # default_server соседа даёт ложное «держим мы» (поймано прогоном 33394416236).
          sudo nginx -T 2>/dev/null | awk '/# configuration file/{f=$NF} /^[[:space:]]*listen[^#]*default_server/{print "default_server держит: " (f ~ /dkmalmyzh/ ? "мы" : "сосед"); exit}'
          echo
          echo "── кто отвечает на наш Host (маркер контента):"
          H="Host: xn--d1amdcjpngc5fh.xn--80adkdyec4j.xn--p1ai"
          curl -s --max-time 15 -H "$H" -H "X-Forwarded-Proto: https" http://127.0.0.1/ | grep -oiE "<title>[^<]*</title>" | head -1
          echo "── а что отдаёт наш сервис напрямую (:3005):"
          curl -s --max-time 15 http://127.0.0.1:3005/ | grep -oiE "<title>[^<]*</title>" | head -1
          REMOTE
